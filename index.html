
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Stone Paper Scissors against the computer!">
    <title>Stone Paper Scissors Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 15px;
            min-height: 100vh;
            margin: 0;
        }

        .game {
            background: white;
            color: #222;
            max-width: 450px;
            width: 100%;
            margin: 30px auto;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 25px #0005;
        }

        h1 {
            color: #243b55;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            background: #243b55;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #426b99;
            transform: scale(1.05);
        }

        #result {
            font-size: 21px;
            font-weight: bold;
            margin: 20px;
        }

        #score {
            font-size: 18px;
            color: #243b55;
        }

        .reset {
            background: #e74c3c;
        }

        .reset:hover {
            background: #c0392b;
        }

        @media (max-width: 400px) {
            button {
                font-size: 16px;
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>✊ Stone Paper Scissors ✋</h1>
        <p>Choose your move and beat the computer!</p>

        <div class="choices">
            <button type="button" onclick="play(1)">✊ Stone</button>
            <button type="button" onclick="play(2)">✋ Paper</button>
            <button type="button" onclick="play(3)">✌️ Scissors</button>
        </div>

        <h3 id="moves">Your move: - | Computer: -</h3>

        <div id="result" aria-live="polite">Let's Play!</div>

        <div id="score">
            You: 0 | Computer: 0 | Draws: 0
        </div>

        <br>

        <button type="button" class="reset" onclick="resetGame()">
            Reset Game
        </button>

    </div>

    <script>
        let playerScore = 0;
        let computerScore = 0;
        let draws = 0;

        const names = ["", "Stone", "Paper", "Scissors"];

        function play(user) {
            const computer = Math.floor(Math.random() * 3) + 1;

            document.getElementById("moves").innerText =
                "Your move: " + names[user] +
                " | Computer: " + names[computer];

            let result = "";

            if (user === computer) {
                result = "🤝 It's a Draw!";
                draws++;
            }
            else if (
                (user === 1 && computer === 3) ||
                (user === 2 && computer === 1) ||
                (user === 3 && computer === 2)
            ) {
                result = "🎉 You Won!";
                playerScore++;
            }
            else {
                result = "😢 Computer Won!";
                computerScore++;
            }

            document.getElementById("result").innerText = result;
            updateScore();
        }

        function updateScore() {
            document.getElementById("score").innerText =
                "You: " + playerScore +
                " | Computer: " + computerScore +
                " | Draws: " + draws;
        }

        function resetGame() {
            playerScore = 0;
            computerScore = 0;
            draws = 0;

            document.getElementById("moves").innerText =
                "Your move: - | Computer: -";

            document.getElementById("result").innerText =
                "Let's Play!";

            updateScore();
        }
    </script>

</body>
</html>
